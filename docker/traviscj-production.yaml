# Container-only config overlay.
#
# This file is deliberately NOT in src/main/resources — it's copied onto the
# classpath only by the Dockerfile. Misk loads traviscj-common.yaml first, then
# overlays the deployment-specific file (PRODUCTION -> traviscj-production.yaml),
# so this overrides just the DB endpoint when iotcj runs as a container, while a
# host `gradle run` (which never sees this file) keeps using localhost:3307 from
# traviscj-common.yaml.
#
# The containerized backend talks to the *host's* MySQL (the native mysqld on
# 127.0.0.1:3306), not the throwaway compose `mysql` service. host.docker.internal
# resolves to the host from inside the container (see extra_hosts in
# kv3/docker-compose.yml for Linux/host-gateway support). This makes the data the
# single source of truth that survives `docker-compose down -v`.
data_source:
  host: host.docker.internal
  port: 3306
